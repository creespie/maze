[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-lmezzaba-lurossi"
version = "1.0.0"
description = "Reusable maze generator for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ludovico Rossi" },
    { name = "Lorenzo Mezzabarba" }
]

[tool.setuptools]
packages = ["mezagen"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true